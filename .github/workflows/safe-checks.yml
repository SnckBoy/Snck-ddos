name: Safe command center checks

on:
  push:
    branches: [main, safe-runtime-fixes-2026-11-11, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python files
        run: python -m compileall -q main.py command_center.py web
      - name: Check installer syntax
        run: bash -n install.sh install-command-center.sh
      - name: Run unit and safety tests
        run: pytest -q
