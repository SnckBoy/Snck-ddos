<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snck-ddos</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #121218;
      --border: #1e1e28;
      --red: #e11d48;
      --red-dim: #9f1239;
      --text: #e4e4e7;
      --muted: #71717a;
      --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: var(--red);
      font-weight: 700;
    }
    h1 span { color: var(--muted); font-weight: 400; }
    .status-pill {
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .status-pill.live {
      border-color: var(--red);
      color: var(--red);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }
    .panel h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 4px;
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--red-dim);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btns {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    button {
      flex: 1;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .btn-start {
      background: var(--red);
      color: #fff;
    }
    .btn-stop {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-stop.active {
      border-color: var(--red);
      color: var(--red);
    }
    .btn-scrape {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 12px;
      width: 100%;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .stat {
      background: var(--bg);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }
    .stat .v {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }
    .stat .k {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stat.highlight .v { color: var(--red); }
    .proxy-info {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .proxy-info strong { color: var(--green); }
    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SNCK<span>-ddos</span></h1>
      <div id="pill" class="status-pill">IDLE</div>
    </header>

    <div class="grid">
      <div class="panel">
        <h2>Attack Config</h2>
        <label>Target (URL or host:port)</label>
        <input id="target" type="text" placeholder="https://example.com or 1.2.3.4:80" />

        <div class="row">
          <div>
            <label>Method</label>
            <select id="method">
              <option>GET</option>
              <option>POST</option>
              <option>HEAD</option>
              <option>STRESS</option>
              <option>SLOW</option>
              <option>UDP</option>
              <option>TCP</option>
            </select>
          </div>
          <div>
            <label>Threads</label>
            <input id="threads" type="number" value="300" min="1" max="5000" />
          </div>
        </div>

        <div class="row">
          <div>
            <label>Duration (sec)</label>
            <input id="duration" type="number" value="120" min="5" />
          </div>
          <div>
            <label>Payload size</label>
            <input id="payload" type="number" value="2048" min="64" />
          </div>
        </div>

        <label style="display:flex;align-items:center;gap:8px;margin-top:14px;cursor:pointer">
          <input id="use_proxies" type="checkbox" checked style="width:auto" />
          Use live proxies
        </label>

        <div class="btns">
          <button class="btn-start" onclick="startAttack()">START</button>
          <button id="btnStop" class="btn-stop" onclick="stopAttack()">STOP</button>
        </div>
      </div>

      <div class="panel">
        <h2>Live Stats</h2>
        <div class="stats">
          <div class="stat highlight"><div class="v" id="rps">0</div><div class="k">RPS</div></div>
          <div class="stat highlight"><div class="v" id="mbps">0</div><div class="k">Mbps</div></div>
          <div class="stat"><div class="v" id="reqs">0</div><div class="k">Requests</div></div>
          <div class="stat"><div class="v" id="workers">0</div><div class="k">Workers</div></div>
          <div class="stat"><div class="v" id="errors">0</div><div class="k">Errors</div></div>
          <div class="stat"><div class="v" id="uptime">0s</div><div class="k">Uptime</div></div>
        </div>
        <div class="proxy-info">
          Proxies — raw: <strong id="rawP">0</strong> · live: <strong id="liveP">0</strong>
        </div>
        <button class="btn-scrape" onclick="scrapeProxies()">SCRAPE + CHECK PROXIES</button>
      </div>
    </div>

    <footer>Snck-ddos · panel on :6666 · authorized testing only</footer>
  </div>

  <script>
    async function poll() {
      try {
        const s = await (await fetch("/api/stats")).json();
        document.getElementById("rps").textContent = s.rps;
        document.getElementById("mbps").textContent = s.mbps;
        document.getElementById("reqs").textContent = s.requests.toLocaleString();
        document.getElementById("workers").textContent = s.active_workers;
        document.getElementById("errors").textContent = s.errors;
        document.getElementById("uptime").textContent = s.uptime + "s";
        const pill = document.getElementById("pill");
        const stop = document.getElementById("btnStop");
        if (s.running) {
          pill.textContent = "LIVE · " + s.method;
          pill.classList.add("live");
          stop.classList.add("active");
        } else {
          pill.textContent = "IDLE";
          pill.classList.remove("live");
          stop.classList.remove("active");
        }
      } catch (e) {}
      try {
        const p = await (await fetch("/api/proxies")).json();
        document.getElementById("rawP").textContent = p.raw;
        document.getElementById("liveP").textContent = p.live;
      } catch (e) {}
    }
    setInterval(poll, 800);
    poll();

    async function startAttack() {
      const body = {
        target: document.getElementById("target").value.trim(),
        method: document.getElementById("method").value,
        threads: parseInt(document.getElementById("threads").value) || 200,
        duration: parseInt(document.getElementById("duration").value) || 60,
        payload_size: parseInt(document.getElementById("payload").value) || 1024,
        use_proxies: document.getElementById("use_proxies").checked,
      };
      if (!body.target) { alert("set a target"); return; }
      const r = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (!j.ok) alert(j.error || "failed");
    }

    async function stopAttack() {
      await fetch("/api/stop", { method: "POST" });
    }

    async function scrapeProxies() {
      await fetch("/api/scrape", { method: "POST" });
      alert("scrape + check running in background");
    }
  </script>
</body>
</html>
