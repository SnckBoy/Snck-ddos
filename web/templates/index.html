<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snck-ddos</title>
  <style>
    :root {
      --bg: #0a0a0c; --panel: #121218; --border: #1e1e28;
      --red: #e11d48; --text: #e4e4e7; --muted: #71717a; --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: ui-monospace, Menlo, monospace; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    .wrap { max-width: 960px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    h1 { color: var(--red); font-size: 1.25rem; } h1 span { color: var(--muted); font-weight: 400; }
    .pill { font-size: .75rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .pill.live { border-color: var(--red); color: var(--red); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .panel h2 { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 10px; }
    label { display: block; font-size: .7rem; color: var(--muted); margin: 8px 0 4px; }
    input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 6px; font-family: inherit; font-size: .85rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btns { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; border: none; padding: 11px; border-radius: 6px; font-family: inherit; font-weight: 600; cursor: pointer; font-size: .8rem; }
    .go { background: var(--red); color: #fff; } .stop { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: var(--bg); border-radius: 8px; padding: 12px; text-align: center; }
    .stat .v { font-size: 1.15rem; font-weight: 700; } .stat .k { font-size: .65rem; color: var(--muted); margin-top: 3px; }
    .hl .v { color: var(--red); }
    footer { margin-top: 20px; text-align: center; font-size: .7rem; color: var(--muted); }
  </style>
</head>
<body>
<div class="wrap">
  <header><h1>SNCK<span>-ddos</span></h1><div id="pill" class="pill">IDLE</div></header>
  <div class="grid">
    <div class="panel">
      <h2>Config</h2>
      <label>Target</label><input id="target" placeholder="http://example.com or IP:port" />
      <div class="row">
        <div><label>Method</label>
          <select id="method">
            <optgroup label="Layer 7">
              <option>GET</option><option>POST</option><option>HEAD</option>
              <option>STRESS</option><option>SLOW</option><option>PPS</option>
              <option>COOKIE</option><option>RHEX</option><option>DYN</option>
              <option>CFB</option><option>OVH</option><option>BYPASS</option>
              <option>GSB</option><option>XMLRPC</option>
            </optgroup>
            <optgroup label="Layer 4">
              <option>UDP</option><option>TCP</option><option>SYN</option>
              <option>ACK</option><option>CPS</option>
            </optgroup>
            <optgroup label="Layer 3 / Game">
              <option>ICMP</option><option>VSE</option><option>MCBOT</option>
            </optgroup>
          </select>
        </div>
        <div><label>Threads</label><input id="threads" type="number" value="300" min="1" max="5000" /></div>
      </div>
      <div class="row">
        <div><label>Duration (sec)</label><input id="duration" type="number" value="120" min="5" /></div>
        <div><label>Payload</label><input id="payload" type="number" value="1200" min="64" /></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;cursor:pointer;margin-top:10px">
        <input id="px" type="checkbox" checked style="width:auto" /> Proxies
      </label>
      <div class="btns">
        <button class="go" onclick="go()">START</button>
        <button class="stop" onclick="stop()">STOP</button>
      </div>
    </div>
    <div class="panel">
      <h2>Stats</h2>
      <div class="stats">
        <div class="stat hl"><div class="v" id="rps">0</div><div class="k">RPS</div></div>
        <div class="stat hl"><div class="v" id="mbps">0</div><div class="k">Mbps</div></div>
        <div class="stat"><div class="v" id="reqs">0</div><div class="k">Reqs</div></div>
        <div class="stat"><div class="v" id="w">0</div><div class="k">Workers</div></div>
        <div class="stat"><div class="v" id="err">0</div><div class="k">Errors</div></div>
        <div class="stat"><div class="v" id="up">0s</div><div class="k">Up</div></div>
      </div>
      <p style="margin-top:10px;font-size:.75rem;color:var(--muted)">Proxies: <b id="raw" style="color:var(--green)">0</b> / live <b id="live" style="color:var(--green)">0</b></p>
      <button class="stop" style="width:100%;margin-top:10px;color:var(--text)" onclick="scrape()">SCRAPE PROXIES</button>
    </div>
  </div>
  <footer>Snck-ddos · 22 methods · L3/L4/L7 · :6767 · authorized only</footer>
</div>
<script>
async function poll(){
  try{
    const s=await(await fetch('/api/stats')).json();
    rps.textContent=s.rps||0; mbps.textContent=s.mbps||0;
    reqs.textContent=(s.requests||0).toLocaleString();
    w.textContent=s.active_workers||0; err.textContent=s.errors||0;
    up.textContent=(s.uptime||0)+'s';
    if(s.running){pill.textContent='LIVE '+(s.method||'');pill.classList.add('live')}
    else{pill.textContent='IDLE';pill.classList.remove('live')}
  }catch(e){}
  try{const p=await(await fetch('/api/proxies')).json();raw.textContent=p.raw||0;live.textContent=p.live||0}catch(e){}
}
setInterval(poll,800);poll();
async function go(){
  const body={target:target.value.trim(),method:method.value,threads:+threads.value||200,
    duration:+duration.value||60,payload_size:+payload.value||1024,use_proxies:px.checked};
  if(!body.target){alert('set target');return}
  const j=await(await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  if(!j.ok)alert(j.error||'fail');
}
async function stop(){await fetch('/api/stop',{method:'POST'})}
async function scrape(){await fetch('/api/scrape',{method:'POST'});alert('scrape started')}
</script>
</body>
</html>
